name: Feeds → Discord

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sebrae-missoes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Missões Sebrae/SE
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python sebrae_missoes.py

      - name: Compilado do Código Fonte TV
        if: success() || failure()   # roda mesmo se as missões falharem
        env:
          DISCORD_WEBHOOK_COMPILADO_URL: ${{ secrets.DISCORD_WEBHOOK_COMPILADO_URL }}
        run: python compilado.py

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in posted.json posted_compilado.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "Atualiza itens postados" && git push)
