name: Missões Sebrae/SE → Discord

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sebrae-missoes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar e postar missões
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python sebrae_missoes.py

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Atualiza missões postadas" && git push)
