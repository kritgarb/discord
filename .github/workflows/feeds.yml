name: Feeds → Discord

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest discover -s tests -t .   # só tests/: não importa ponto.bot (discord.py não é instalado aqui)

      # Roda todas as integrações; se uma falhar, as outras rodam mesmo assim e o passo sai com erro.
      - name: Publicar no Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_COMPILADO_URL: ${{ secrets.DISCORD_WEBHOOK_COMPILADO_URL }}
        run: python -m feeds all

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Atualiza itens postados"
          # O push pode falhar por erro transitório do GitHub ou por um commit novo na branch.
          # Se o estado não subir, a próxima execução reenvia as mensagens, então insiste.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase -q origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "::warning::push do estado falhou (tentativa $attempt/5), tentando de novo..."
            sleep $((attempt * 15))
          done
          echo "::error::Não consegui salvar o estado. Na próxima execução, as mensagens desta rodada serão reenviadas."
          exit 1
