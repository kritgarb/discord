name: Feeds → Discord

on:
  schedule:
    - cron: "0 * * * *"   # de hora em hora (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Testes
        run: python -m unittest

      # Roda todas as integrações; se uma falhar, as outras rodam mesmo assim e o passo sai com erro.
      - name: Publicar no Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_COMPILADO_URL: ${{ secrets.DISCORD_WEBHOOK_COMPILADO_URL }}
        run: python -m feeds all

      - name: Salvar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "Atualiza itens postados" && git push)
